[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "yancarrel1@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
    "llm-sdk",
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk", editable = true }

[tool.mypy]
exclude = [
    '.venv/',
    'llm_sdk/'
]
